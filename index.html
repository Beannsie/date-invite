<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question For You 💌</title>
<style>
  :root{
    --brume:#C2F2E4;
    --menthe:#35C8B4;
    --limonade:#EDF7BE;
    --verveine:#A4CF4A;
    --text:#2d4a44;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:linear-gradient(135deg,var(--brume) 0%,var(--menthe) 35%,var(--limonade) 70%,var(--verveine) 100%);
    background-size:200% 200%;
    animation:drift 12s ease infinite;
    padding:20px;
    position:relative;
    overflow:hidden;
  }
  @keyframes drift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .card{
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(6px);
    border-radius:28px;
    max-width:480px;
    width:100%;
    padding:40px 32px;
    text-align:center;
    box-shadow:0 20px 50px rgba(53,200,180,0.35);
    animation:pop .6s ease;
    position:relative;
    z-index:1;
  }
  @keyframes pop{
    from{transform:scale(.9);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }
  h1{
    color:var(--text);
    font-size:1.7rem;
    margin:0 0 6px;
    line-height:1.3;
  }
  .headline{
    font-size:2.1rem;
    margin-bottom:6px;
  }
  p.sub{
    color:#4f6b64;
    margin:10px 0 26px;
    font-size:1rem;
  }
  .days{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  button.day{
    border:none;
    border-radius:18px;
    padding:18px 12px;
    background:white;
    color:var(--text);
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 6px 14px rgba(53,200,180,0.25);
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
    line-height:1.35;
  }
  button.day .emoji{
    display:block;
    font-size:1.8rem;
    margin-bottom:6px;
  }
  button.day .name{
    display:block;
    font-size:1.05rem;
    margin-bottom:4px;
  }
  button.day .pun{
    display:block;
    font-size:.82rem;
    font-weight:400;
    color:#6a8a82;
  }
  button.day:hover{
    transform:translateY(-4px) scale(1.03);
    background:var(--menthe);
    color:white;
    box-shadow:0 10px 22px rgba(53,200,180,0.45);
  }
  button.day:hover .pun{color:#eafff9;}
  button.day:active{transform:scale(.97);}

  .no-wrap{
    margin-top:22px;
    height:54px;
    position:relative;
  }
  #noBtn{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    border:2px solid var(--verveine);
    background:white;
    color:var(--verveine);
    border-radius:16px;
    padding:12px 22px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    transition:top .12s ease, left .12s ease;
  }

  .result{
    display:none;
  }
  .result.show{
    display:block;
    animation:pop .5s ease;
  }
  .result .big{
    font-size:3rem;
    margin-bottom:10px;
  }
  .result h2{
    color:var(--text);
    margin:0 0 8px;
    font-size:1.4rem;
  }
  .result p{
    color:#4f6b64;
    margin:0;
  }
  .hidden{display:none !important;}
  footer{
    margin-top:22px;
    font-size:.75rem;
    color:#7fa89e;
  }
</style>
</head>
<body>
  <div class="card">
    <div id="ask">
      <div class="headline">🍩🍕🍣🌮</div>
      <h1>I'm soy into you...<br>wanna go for sushi?<br>(or tacos, or pizza, or donuts — you pick the day 😉)</h1>
      <p class="sub">Pick a day and I'll pick the place:</p>
      <div class="days" id="dayButtons">
        <button class="day" data-day="Thursday" data-plan="Taco night 🌮" data-pun="Lettuce taco 'bout Thursday">
          <span class="emoji">🌮</span>
          <span class="name">Thursday</span>
          <span class="pun">Lettuce taco 'bout it</span>
        </button>
        <button class="day" data-day="Friday" data-plan="Pizza night 🍕" data-pun="I dough-nut want to wait — Friday?">
          <span class="emoji">🍕</span>
          <span class="name">Friday</span>
          <span class="pun">Let's not wait — pizza?</span>
        </button>
        <button class="day" data-day="Saturday" data-plan="Sushi date 🍣" data-pun="I'm soy into you — Saturday?">
          <span class="emoji">🍣</span>
          <span class="name">Saturday</span>
          <span class="pun">I'm soy into this</span>
        </button>
        <button class="day" data-day="Sunday" data-plan="Coffee & donuts ☕🍩" data-pun="Donut leave me hanging — Sunday?">
          <span class="emoji">🍩</span>
          <span class="name">Sunday</span>
          <span class="pun">Donut leave me hanging</span>
        </button>
      </div>

      <div class="no-wrap">
        <button id="noBtn">No 🙃</button>
      </div>

      <p id="status" style="margin-top:16px;font-size:.85rem;color:#7fa89e;"></p>
    </div>

    <div class="result" id="result">
      <div class="big" id="resultEmoji">🎉</div>
      <h2 id="resultTitle"></h2>
      <p id="resultSub"></p>
    </div>

    <footer>made with 💗 just for you</footer>
  </div>

<script>
  const SUPABASE_URL = "https://qcvdhtzisctxbuvkqkyl.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_zMRHoAyH873hBziygAkf5Q_p_D9AU-q";

  const buttons = document.querySelectorAll('button.day');
  const status = document.getElementById('status');
  const ask = document.getElementById('ask');
  const result = document.getElementById('result');
  const resultTitle = document.getElementById('resultTitle');
  const resultSub = document.getElementById('resultSub');
  const resultEmoji = document.getElementById('resultEmoji');

  buttons.forEach(btn => {
    btn.addEventListener('click', async () => {
      buttons.forEach(b => b.disabled = true);
      status.textContent = "Sending...";

      const day = btn.dataset.day;
      const plan = btn.dataset.plan;
      const pun = btn.dataset.pun;

      try {
        await fetch(`${SUPABASE_URL}/rest/v1/date_responses`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({ day, plan })
        });
      } catch (e) {
        // still show confirmation even if the network hiccups
      }

      resultEmoji.textContent = "🎉";
      resultTitle.textContent = `${day} it is!`;
      resultSub.textContent = `${pun} Can't wait — see you then 💕`;

      ask.classList.add('hidden');
      result.classList.add('show');
    });
  });

  // "No" button runs away from the cursor — there is no acceptable "no" here
  const noBtn = document.getElementById('noBtn');
  const noWrap = document.querySelector('.no-wrap');

  function dodge() {
    const wrapRect = noWrap.getBoundingClientRect();
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;
    const maxLeft = Math.max(wrapRect.width - btnW, 0);
    const maxTop = Math.max(40, 0); // small vertical wiggle room within the wrap

    const newLeft = Math.random() * maxLeft;
    const newTop = (Math.random() - 0.5) * 20;

    noBtn.style.left = `${newLeft}px`;
    noBtn.style.transform = "none";
    noBtn.style.top = `${newTop}px`;
  }

  noBtn.addEventListener('mouseover', dodge);
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    dodge();
  }, { passive: false });
</script>
</body>
</html>
